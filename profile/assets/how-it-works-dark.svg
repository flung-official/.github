<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1307 352" width="1307" height="352" role="img" aria-labelledby="dg-title dg-desc" aria-description="How Flung works: 6 nodes, 5 connections. Your app, an AI agent or the connect panel on your page reaches the Flung API. People connect their accounts once; Flung keeps the tokens fresh and publishes each post when it is due, then tells your app through webhooks." style="max-width:100%;height:auto" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" data-theme="dark"><title id="dg-title">How Flung works</title><desc id="dg-desc">How Flung works: 6 nodes, 5 connections. Your app, an AI agent or the connect panel on your page reaches the Flung API. People connect their accounts once; Flung keeps the tokens fresh and publishes each post when it is due, then tells your app through webhooks.
Nodes:
- Flung API (Schedules, renews, publishes), service
- Group: Write
  - Your app (SDK or REST), client
  - AI agent (Claude, Cursor, ChatGPT), agent
  - Connect panel (&lt;flung-connect&gt;), client
- Group: Publish
  - 12 networks (X, LinkedIn, Instagram, Bluesky...), external
  - Your webhooks (Signed events), client
Connections:
- Your app to Flung API: REST
- AI agent to Flung API: MCP
- Connect panel to Flung API: connect token
- Flung API to 12 networks: publishes
- Flung API to Your webhooks (dotted): events</desc><metadata data-format="buun-diagram">flow "How Flung works" desc="Your app, an AI agent or the connect panel on your page reaches the Flung API. People connect their accounts once; Flung keeps the tokens fresh and publishes each post when it is due, then tells your app through webhooks." direction=right legend=off

group write "Write" type=none {
  node app    client "Your app"        sub="SDK or REST" icon=lucide:code
  node agent  agent  "AI agent"        sub="Claude, Cursor, ChatGPT"
  node panel  client "Connect panel"   sub="&lt;flung-connect&gt;" icon=lucide:plug
}

node api service "Flung API" sub="Schedules, renews, publishes" icon=lucide:send

group out "Publish" type=none {
  node social external "12 networks"  sub="X, LinkedIn, Instagram, Bluesky..." icon=lucide:share-2
  node hooks  client   "Your webhooks" sub="Signed events" icon=lucide:webhook
}

app   -&gt; api    : "REST"
agent -&gt; api    : "MCP"
panel -&gt; api    : "connect token"
api   -&gt; social : "publishes"
api   ..&gt; hooks : "events"
